<section id="contact">

    <h2>Get In Touch</h2>

    <form>

        <label for="name">Name</label>
        <input id="name" type="text">

        <label for="email">Email</label>
        <input id="email" type="email">

        <label for="message">Message</label>
        <textarea id="message"></textarea>

        <button type="submit">
            Send Message
        </button>

    </form>

</section>
