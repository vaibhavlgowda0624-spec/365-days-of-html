<!DOCTYPE html>
<html>
<head>
    <title>Feedback</title>
</head>
<body>

<h1>Website Feedback</h1>

<form>
    <label>Name:</label>
    <input type="text"><br><br>

    <label>Email:</label>
    <input type="email"><br><br>

    <label>Rating:</label>
    <select>
        <option>Excellent</option>
        <option>Good</option>
        <option>Average</option>
        <option>Poor</option>
    </select><br><br>

    <textarea placeholder="Write your feedback"></textarea><br><br>

    <button>Submit Feedback</button>
</form>

</body>
</html>
